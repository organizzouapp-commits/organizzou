<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" class="" role="img" aria-label="Organizzou"><title>Organizzou</title><style>
.tile{transform-box:fill-box;transform-origin:center;animation:tile .6s cubic-bezier(.2,.8,.2,1) both}
.b1{animation:inL .7s cubic-bezier(.2,.8,.2,1) .30s both}
.b2{animation:inR .7s cubic-bezier(.2,.8,.2,1) .45s both}
.b3{animation:inL .7s cubic-bezier(.2,.8,.2,1) .60s both}
.dg{animation:fade .5s ease-out .95s both}
.wm{animation:wm 1.4s cubic-bezier(.3,.1,.2,1) .8s both}
.wipe{transform-box:fill-box;transform-origin:left center;animation:wipe 1.7s cubic-bezier(.4,.05,.25,1) .8s both}
@keyframes tile{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
@keyframes inL{from{opacity:0;transform:translateX(-70px)}to{opacity:1;transform:none}}
@keyframes inR{from{opacity:0;transform:translateX(70px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes wm{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@keyframes wipe{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes wave{0%,100%{transform:translateX(0)}50%{transform:translateX(var(--d))}}
.loop .l1,.loop .l3{--d:9px;animation:wave 1.8s ease-in-out 2.6s infinite}
.loop .l2{--d:-9px;animation:wave 1.8s ease-in-out 2.6s infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><clipPath id="tc"><rect width="120" height="120" rx="27"/></clipPath></defs><g class="tile"><rect width="120" height="120" rx="27" fill="#DBFD00"/></g><g clip-path="url(#tc)"><g transform="translate(14.4,14.4) scale(0.35625)"><g class="dg"><path fill="#4B5A00" d="M191.50,30.14L47.50,113.28L64.50,142.72L208.50,59.58Z"/><path fill="#4B5A00" d="M191.50,113.28L47.50,196.42L64.50,225.86L208.50,142.72Z"/></g><g class="b1"><g class="l1"><path fill="#0C0E07" d="M56.00,27.86H200.00A17.0,17.0 0 0 1 200.00,61.86H56.00A17.0,17.0 0 0 1 56.00,27.86Z"/></g></g><g class="b2"><g class="l2"><path fill="#0C0E07" d="M56.00,111.00H200.00A17.0,17.0 0 0 1 200.00,145.00H56.00A17.0,17.0 0 0 1 56.00,111.00Z"/></g></g><g class="b3"><g class="l3"><path fill="#0C0E07" d="M56.00,194.14H200.00A17.0,17.0 0 0 1 200.00,228.14H56.00A17.0,17.0 0 0 1 56.00,194.14Z"/></g></g></g></g></svg>