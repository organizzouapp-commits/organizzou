# Runs the notification dispatcher every 5 minutes. Vercel Cron on the Hobby plan only allows one run per day (vercel.json keeps that daily
# run as a safety net); this workflow is what makes the notifications arrive on time. On a Vercel plan that allows minute-level cron, set
# "*/5 * * * *" in vercel.json and delete this file.
# Repository secrets needed: APP_URL (e.g. https://organizzou.vercel.app, no trailing slash) and CRON_SECRET (the same value as on Vercel).
name: notifications-cron
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Call the dispatcher
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$APP_URL" && test -n "$CRON_SECRET" || { echo "APP_URL or CRON_SECRET is not set"; exit 1; }
          curl --fail --silent --show-error --max-time 60 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/notifications"
